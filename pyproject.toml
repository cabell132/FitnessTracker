[build-system]  # https://packaging.python.org/en/latest/specifications/build-system/
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]  # https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "fitness_tracker"
version = "0.0.0"
description = "A package to group all my fitness fitness apps into one place and allow for the syncing between apps"
authors = [
    {name = "Cameron Bell", email = "cabell132@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic>=1.10.7",
    "python-dotenv>=1.0.1",
    "certifi>=2024.12.14",
    "sqlalchemy==1.4.53",
    "alembic>=1.14.1",
    "rapidfuzz>=3.11.0",
    "beautifulsoup4>=4.12.3",
    "pandas>=2.2.3",
    "tqdm>=4.67.1",
    "langchain>=0.3.15",
    "langsmith>=0.3.1",
    "langchain-openai>=0.3.2",
    "dropbox>=12.0.2",
    "matplotlib>=3.10.0",
    "plotly>=6.0.0",
    "nbformat>=5.10.4",
]

[project.optional-dependencies]
test = [
    "commitizen>=3.2.1",
    "coverage[toml]>=7.2.5",
    "poethepoet>=0.20.0",
    "pre-commit>=3.3.1",
    "pytest>=7.3.1",
    "pytest-clarity>=1.0.1",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.2.1",
    "ruff>=0.1.3",
    "safety>=2.3.4,!=2.3.5",
    "shellcheck-py>=0.9.0",
    "typeguard>=3.0.2",
]
dev = [
    "ipykernel>=6.29.5",
    "types-sqlalchemy==1.4.53.38",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-python-dateutil>=2.9.0",
    "ty>=0.0.1a8",
    "pydoclint>=0.6.0",
    "poethepoet>=0.25",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    "sloppylint>=0.5.1",
    "ai-slop-detector>=2.7.0",
]

[tool.uv]
managed = true

[tool.commitizen]  # https://commitizen-tools.github.io/commitizen/config/
bump_message = "bump(release): v$current_version → v$new_version"
tag_format = "v$version"
update_changelog_on_bump = true
version = "0.0.0"
version_files = ["pyproject.toml:project.version"]

[tool.coverage.run]
branch = true
source = ["fitness_tracker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.coverage.xml]  # https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --maxfail=1"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A", "ANN", "ASYNC", "B", "BLE", "C4", "C90", "D", "DTZ", "E", "EM",
    "ERA", "F", "FBT", "FLY", "FURB", "G", "I", "ICN", "INP", "INT",
    "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW",
    "PT", "PTH", "PYI", "RET", "RSE", "RUF", "S", "SIM", "SLF", "SLOT",
    "T10", "T20", "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
    "ANN401", "E501", "ISC001", "I001", "PGH003", "PERF203", "FBT001",
    "FBT002", "PLR2004", "S101", "RET504",
]
unfixable = ["ERA001", "F841", "RUF100", "T201", "T203"]
external = ["DOC"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 3
max-statements = 20

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "SLF001", "TID252", "F401", "F403", "E402", "S105", "D", "PLC0415"]
"fitness_tracker/database/models/__init__.py" = ["F403", "F405"]
"fitness_tracker/database/repository/__init__.py" = ["F403", "F405"]
"fitness_tracker/llm/prompt_templates.py" = ["S608"]

# Static types: use ty only ([tool.ty]); mypy is intentionally not configured.
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["fitness_tracker"]

[tool.ty.rules]
unknown-argument = "ignore"
possibly-missing-attribute = "ignore"
unused-ignore-comment = "ignore"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-yield-types = true
require-return-section-when-returning-nothing = false
check-class-attributes = false
exclude = '\.ipynb$|^tests/'
skip-checking-short-docstrings = false
allow-init-docstring = true

[tool.poe.tasks.format]
cmd = "ruff format fitness_tracker tests"

[tool.poe.tasks.lint]
cmd = "ruff check fitness_tracker tests"

[tool.poe.tasks.typecheck]
cmd = "ty check"

[tool.poe.tasks.doclint]
cmd = "pydoclint fitness_tracker"

[tool.poe.tasks.test]
cmd = "pytest --cov --maxfail=1 --disable-warnings"

[tool.poe.tasks.format-check]
cmd = "ruff format --check fitness_tracker tests"

[tool.poe.tasks.audit]
cmd = "pip-audit"

[tool.poe.tasks.check]
sequence = ["format", "lint", "typecheck", "doclint", "test"]
help = "Run all quality checks"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["fitness_tracker/__init__.py:__version__"]
version_source = "tag"
assets = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "angular"
logging_use_named_masks = false
major_on_zero = true
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
